spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:project_service_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""

  sql:
    init:
      mode: never

  liquibase:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379